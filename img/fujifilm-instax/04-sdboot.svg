<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Arial,Helvetica,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#000000"/></marker>
  </defs>
  <rect width="800" height="330" fill="#ffffff"/>
  <!-- SD card -->
  <path d="M65 40 H190 V250 H30 V75 Z" fill="#000080" stroke="#000000" stroke-width="2"/>
  <g fill="#ffff00"><rect x="80" y="48" width="12" height="22" rx="2"/><rect x="100" y="48" width="12" height="22" rx="2"/><rect x="120" y="48" width="12" height="22" rx="2"/><rect x="140" y="48" width="12" height="22" rx="2"/><rect x="160" y="48" width="12" height="22" rx="2"/></g>
  <rect x="42" y="88" width="136" height="62" fill="#fff"/>
  <text x="52" y="110" font-size="13" font-weight="700" fill="#000000" font-family="'Courier New',Courier,monospace">ffinit.bin</text>
  <text x="52" y="128" font-size="11" fill="#404040">small loader</text>
  <text x="52" y="142" font-size="11" fill="#404040">(jitl's FujiMod)</text>
  <rect x="42" y="160" width="136" height="78" fill="#fff"/>
  <text x="52" y="182" font-size="13" font-weight="700" fill="#000000" font-family="'Courier New',Courier,monospace">ffboot.bin</text>
  <text x="52" y="200" font-size="11" fill="#404040">the whole RAM, 72 MB,</text>
  <text x="52" y="214" font-size="11" fill="#404040">built from the firmware</text>
  <text x="52" y="230" font-size="11" fill="#808000" font-weight="700">+ my patches</text>
  <path d="M200 145 H268" stroke="#000000" stroke-width="2" marker-end="url(#a)"/>

  <!-- camera -->
  <rect x="279" y="73" width="250" height="150" fill="#000000"/><rect x="276" y="70" width="250" height="150" fill="#c0c0c0" stroke="#000000" stroke-width="2"/><path d="M278.5 217V72.5H523" fill="none" stroke="#ffffff" stroke-width="2"/><path d="M279 217.5H523.5V73" fill="none" stroke="#808080" stroke-width="2"/>
  <text x="401" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#000000">X-T30 II</text>
  <text x="401" y="122" text-anchor="middle" font-size="12" fill="#000000">hold <tspan font-weight="700">Delete + rear dial</tspan></text>
  <text x="401" y="138" text-anchor="middle" font-size="12" fill="#000000">at power-on</text>
  <rect x="299" y="155" width="210" height="52" fill="#000000"/><rect x="296" y="152" width="210" height="52" fill="#c0c0c0" stroke="#000080" stroke-width="2"/><path d="M298.5 201V154.5H503" fill="none" stroke="#ffffff" stroke-width="2"/><path d="M299 201.5H503.5V155" fill="none" stroke="#808080" stroke-width="2"/>
  <text x="401" y="174" text-anchor="middle" font-size="12" fill="#000000">the loader copies ffboot.bin</text>
  <text x="401" y="191" text-anchor="middle" font-size="12" fill="#000000">into RAM and jumps in</text>

  <!-- flash -->
  <rect x="590" y="70" width="180" height="150" fill="#fff" stroke="#808080" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="680" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#000000">internal flash</text>
  <rect x="663" y="132" width="34" height="28" rx="2" fill="#008080"/>
  <path d="M670 132 V122 A10 10 0 0 1 690 122 V132" fill="none" stroke="#008080" stroke-width="2"/>
  <text x="680" y="186" text-anchor="middle" font-size="13" fill="#008080" font-weight="700">never written</text>
  <text x="680" y="204" text-anchor="middle" font-size="12" fill="#404040">stock firmware stays</text>
  <path d="M534 145 H582" stroke="#808080" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="558" y="138" text-anchor="middle" font-size="18" fill="#ff0000">✗</text>

  <rect x="153" y="265" width="500" height="44" fill="#000000"/><rect x="150" y="262" width="500" height="44" fill="#ffffff" stroke="#008080" stroke-width="2"/>
  <text x="400" y="289" text-anchor="middle" font-size="14" fill="#000000">Pull the battery, start without the card → <tspan font-weight="700">100 % stock camera</tspan></text>
</svg>
