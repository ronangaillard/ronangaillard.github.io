<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#22272a"/></marker>
  </defs>
  <rect width="800" height="330" fill="#fafafa"/>
  <!-- SD card -->
  <path d="M30 40 H190 V250 H30 V75 Z" fill="#2b3a55" stroke="#22272a" stroke-width="2.5"/>
  <path d="M30 75 L65 40" stroke="#22272a" stroke-width="2.5"/>
  <g fill="#e2b93b"><rect x="80" y="48" width="12" height="22" rx="2"/><rect x="100" y="48" width="12" height="22" rx="2"/><rect x="120" y="48" width="12" height="22" rx="2"/><rect x="140" y="48" width="12" height="22" rx="2"/><rect x="160" y="48" width="12" height="22" rx="2"/></g>
  <rect x="42" y="88" width="136" height="62" rx="6" fill="#fff"/>
  <text x="52" y="110" font-size="13" font-weight="700" fill="#22272a" font-family="Menlo,monospace">ffinit.bin</text>
  <text x="52" y="128" font-size="11" fill="#6b7280">small loader</text>
  <text x="52" y="142" font-size="11" fill="#6b7280">(jitl's FujiMod)</text>
  <rect x="42" y="160" width="136" height="78" rx="6" fill="#fff"/>
  <text x="52" y="182" font-size="13" font-weight="700" fill="#22272a" font-family="Menlo,monospace">ffboot.bin</text>
  <text x="52" y="200" font-size="11" fill="#6b7280">the whole RAM, 72 MB,</text>
  <text x="52" y="214" font-size="11" fill="#6b7280">built from the firmware</text>
  <text x="52" y="230" font-size="11" fill="#c27a00" font-weight="700">+ my patches</text>
  <path d="M200 145 H268" stroke="#22272a" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- camera -->
  <rect x="276" y="70" width="250" height="150" rx="14" fill="#e9e9e9" stroke="#22272a" stroke-width="2.5"/>
  <text x="401" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#22272a">X-T30 II</text>
  <text x="401" y="122" text-anchor="middle" font-size="12" fill="#22272a">hold <tspan font-weight="700">Delete + rear dial</tspan></text>
  <text x="401" y="138" text-anchor="middle" font-size="12" fill="#22272a">at power-on</text>
  <rect x="296" y="152" width="210" height="52" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="2"/>
  <text x="401" y="174" text-anchor="middle" font-size="12" fill="#22272a">the loader copies ffboot.bin</text>
  <text x="401" y="191" text-anchor="middle" font-size="12" fill="#22272a">into RAM and jumps in</text>

  <!-- flash -->
  <rect x="590" y="70" width="180" height="150" rx="14" fill="#fff" stroke="#9ca3af" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="680" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#22272a">internal flash</text>
  <rect x="663" y="132" width="34" height="28" rx="4" fill="#1f8a4c"/>
  <path d="M670 132 V122 A10 10 0 0 1 690 122 V132" fill="none" stroke="#1f8a4c" stroke-width="4"/>
  <text x="680" y="186" text-anchor="middle" font-size="13" fill="#1f8a4c" font-weight="700">never written</text>
  <text x="680" y="204" text-anchor="middle" font-size="12" fill="#6b7280">stock firmware stays</text>
  <path d="M534 145 H582" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="558" y="138" text-anchor="middle" font-size="18" fill="#d9372b">✗</text>

  <rect x="150" y="262" width="500" height="44" rx="22" fill="#eef6f0" stroke="#1f8a4c" stroke-width="2"/>
  <text x="400" y="289" text-anchor="middle" font-size="14" fill="#22272a">Pull the battery, start without the card → <tspan font-weight="700">100 % stock camera</tspan></text>
</svg>
