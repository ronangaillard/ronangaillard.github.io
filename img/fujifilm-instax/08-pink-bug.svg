<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Arial,Helvetica,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#000000"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#ff0000"/></marker>
  </defs>
  <rect width="800" height="560" fill="#ffffff"/>
  <text x="400" y="26" text-anchor="middle" font-size="13" fill="#404040">The photo is resized and rotated into buffer A (YUV). The JPEG encoder always reads buffer B.</text>

  <!-- lane 1 -->
  <text x="30" y="62" font-size="14" font-weight="700" fill="#000000">Printer without capability bit 3</text>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="33" y="77" width="110" height="40" fill="#000000"/><rect x="30" y="74" width="110" height="40" fill="#ffffff" stroke="#008080" stroke-width="2"/><text x="85" y="99" fill="#008080">A: YUV</text>
    <rect x="463" y="77" width="110" height="40" fill="#000000"/><rect x="460" y="74" width="110" height="40" fill="#ffffff" stroke="#008080" stroke-width="2"/><text x="515" y="99" fill="#008080">B: YUV</text>
    <rect x="643" y="77" width="130" height="40" fill="#000000"/><rect x="640" y="74" width="130" height="40" fill="#fff" stroke="#000000" stroke-width="2"/><text x="705" y="99" fill="#000000">good JPEG</text>
  </g>
  <path d="M142 94 H454" stroke="#000000" stroke-width="2" marker-end="url(#a)"/>
  <text x="298" y="87" text-anchor="middle" font-size="11" fill="#404040">copy A to B</text>
  <path d="M572 94 H634" stroke="#000000" stroke-width="2" marker-end="url(#a)"/>

  <!-- lane 2 -->
  <text x="30" y="160" font-size="14" font-weight="700" fill="#000000">Printer with bit 3: what should happen</text>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="33" y="175" width="110" height="40" fill="#000000"/><rect x="30" y="172" width="110" height="40" fill="#ffffff" stroke="#008080" stroke-width="2"/><text x="85" y="197" fill="#008080">A: YUV</text>
    <rect x="248" y="175" width="110" height="40" fill="#000000"/><rect x="245" y="172" width="110" height="40" fill="#ffff00" stroke="#808000" stroke-width="2"/><text x="300" y="197" fill="#000000">A: ARGB</text>
    <rect x="463" y="175" width="110" height="40" fill="#000000"/><rect x="460" y="172" width="110" height="40" fill="#ffffff" stroke="#008080" stroke-width="2"/><text x="515" y="197" fill="#008080">B: YUV</text>
    <rect x="643" y="175" width="130" height="40" fill="#000000"/><rect x="640" y="172" width="130" height="40" fill="#fff" stroke="#000000" stroke-width="2"/><text x="705" y="197" fill="#000000">good JPEG</text>
  </g>
  <path d="M142 192 H239" stroke="#000000" stroke-width="2" marker-end="url(#a)"/>
  <text x="190" y="185" text-anchor="middle" font-size="11" fill="#404040">to ARGB</text>
  <path d="M357 192 H454" stroke="#000000" stroke-width="2" marker-end="url(#a)"/>
  <text x="406" y="185" text-anchor="middle" font-size="11" fill="#404040">colour tweak</text>
  <text x="406" y="208" text-anchor="middle" font-size="11" fill="#404040">back to YUV in B</text>
  <path d="M572 192 H634" stroke="#000000" stroke-width="2" marker-end="url(#a)"/>

  <!-- lane 3 -->
  <text x="30" y="270" font-size="14" font-weight="700" fill="#ff0000">Printer with bit 3: what the X-T30 II actually does (the Link 3 has it)</text>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="33" y="285" width="110" height="40" fill="#000000"/><rect x="30" y="282" width="110" height="40" fill="#ffffff" stroke="#008080" stroke-width="2"/><text x="85" y="307" fill="#008080">A: YUV</text>
    <rect x="248" y="285" width="110" height="40" fill="#000000"/><rect x="245" y="282" width="110" height="40" fill="#ffff00" stroke="#808000" stroke-width="2"/><text x="300" y="307" fill="#000000">A: ARGB</text>
    <rect x="463" y="285" width="110" height="40" fill="#000000"/><rect x="460" y="282" width="110" height="40" fill="#ffffff" stroke="#008080" stroke-width="2"/><text x="515" y="307" fill="#008080">B: YUV</text>
    <rect x="463" y="375" width="110" height="48" fill="#000000"/><rect x="460" y="372" width="110" height="48" fill="#ffc0c0" stroke="#ff0000" stroke-width="2"/><text x="515" y="392" fill="#ff0000">B: half of</text><text x="515" y="408" fill="#ff0000">the ARGB</text>
    <rect x="643" y="379" width="130" height="40" fill="#000000"/><rect x="640" y="376" width="130" height="40" fill="#ffc0ff" stroke="#000000" stroke-width="2"/><text x="705" y="401" fill="#000000">pink, zoomed x2</text>
  </g>
  <path d="M142 302 H239" stroke="#000000" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="190" cy="302" r="10" fill="#ff0000"/><text x="190" y="306" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
  <path d="M357 302 H454" stroke="#000000" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="406" cy="302" r="10" fill="#ff0000"/><text x="406" y="306" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
  <text x="595" y="300" font-size="11" fill="#008080" font-weight="700">good so far</text>
  <path d="M300 324 V396 H454" fill="none" stroke="#ff0000" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="300" cy="360" r="10" fill="#ff0000"/><text x="300" y="364" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
  <text x="40" y="352" font-size="12" fill="#ff0000" font-weight="700">then "copy A to B"</text>
  <text x="40" y="368" font-size="12" fill="#ff0000" font-weight="700">runs anyway…</text>
  <text x="40" y="386" font-size="11" fill="#ff0000">but A is ARGB now, so it</text>
  <text x="40" y="400" font-size="11" fill="#ff0000">overwrites the good B</text>
  <path d="M515 324 V368" stroke="#808080" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="524" y="352" font-size="10" fill="#404040">same B, a moment later</text>
  <path d="M572 396 H634" stroke="#000000" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="603" cy="396" r="10" fill="#ff0000"/><text x="603" y="400" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
  <text x="190" y="336" text-anchor="middle" font-size="10" fill="#404040">to ARGB</text>
  <text x="406" y="336" text-anchor="middle" font-size="10" fill="#404040">tweak, back to YUV</text>
  <text x="603" y="428" text-anchor="middle" font-size="10" fill="#404040">encode B</text>

  <!-- fix -->
  <rect x="33" y="453" width="740" height="92" fill="#000000"/><rect x="30" y="450" width="740" height="92" fill="#ffffff" stroke="#008080" stroke-width="2"/>
  <text x="50" y="476" font-size="14" font-weight="700" fill="#008080">The fix: hide bit 3 from the app</text>
  <text x="50" y="502" font-size="13" fill="#000000" font-family="'Courier New',Courier,monospace">out[5] = rep[13] &amp; ~8;</text>
  <text x="50" y="528" font-size="13" fill="#000000">The app then takes the first path: a plain copy A to B, and a clean JPEG.</text>
</svg>
