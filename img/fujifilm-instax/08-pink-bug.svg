<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#22272a"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#d9372b"/></marker>
  </defs>
  <rect width="800" height="560" fill="#fafafa"/>
  <text x="400" y="26" text-anchor="middle" font-size="13" fill="#6b7280">The photo is resized and rotated into buffer A (YUV). The JPEG encoder always reads buffer B.</text>

  <!-- lane 1 -->
  <text x="30" y="62" font-size="14" font-weight="700" fill="#22272a">Printer without capability bit 3</text>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="30" y="74" width="110" height="40" rx="8" fill="#eef6f0" stroke="#1f8a4c" stroke-width="2"/><text x="85" y="99" fill="#1f8a4c">A: YUV</text>
    <rect x="460" y="74" width="110" height="40" rx="8" fill="#eef6f0" stroke="#1f8a4c" stroke-width="2"/><text x="515" y="99" fill="#1f8a4c">B: YUV</text>
    <rect x="640" y="74" width="130" height="40" rx="8" fill="#fff" stroke="#22272a" stroke-width="2"/><text x="705" y="99" fill="#22272a">good JPEG</text>
  </g>
  <path d="M142 94 H454" stroke="#22272a" stroke-width="2" marker-end="url(#a)"/>
  <text x="298" y="87" text-anchor="middle" font-size="11" fill="#6b7280">copy A to B</text>
  <path d="M572 94 H634" stroke="#22272a" stroke-width="2" marker-end="url(#a)"/>

  <!-- lane 2 -->
  <text x="30" y="160" font-size="14" font-weight="700" fill="#22272a">Printer with bit 3: what should happen</text>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="30" y="172" width="110" height="40" rx="8" fill="#eef6f0" stroke="#1f8a4c" stroke-width="2"/><text x="85" y="197" fill="#1f8a4c">A: YUV</text>
    <rect x="245" y="172" width="110" height="40" rx="8" fill="#fff4e0" stroke="#c27a00" stroke-width="2"/><text x="300" y="197" fill="#c27a00">A: ARGB</text>
    <rect x="460" y="172" width="110" height="40" rx="8" fill="#eef6f0" stroke="#1f8a4c" stroke-width="2"/><text x="515" y="197" fill="#1f8a4c">B: YUV</text>
    <rect x="640" y="172" width="130" height="40" rx="8" fill="#fff" stroke="#22272a" stroke-width="2"/><text x="705" y="197" fill="#22272a">good JPEG</text>
  </g>
  <path d="M142 192 H239" stroke="#22272a" stroke-width="2" marker-end="url(#a)"/>
  <text x="190" y="185" text-anchor="middle" font-size="11" fill="#6b7280">to ARGB</text>
  <path d="M357 192 H454" stroke="#22272a" stroke-width="2" marker-end="url(#a)"/>
  <text x="406" y="185" text-anchor="middle" font-size="11" fill="#6b7280">colour tweak</text>
  <text x="406" y="208" text-anchor="middle" font-size="11" fill="#6b7280">back to YUV in B</text>
  <path d="M572 192 H634" stroke="#22272a" stroke-width="2" marker-end="url(#a)"/>

  <!-- lane 3 -->
  <text x="30" y="270" font-size="14" font-weight="700" fill="#d9372b">Printer with bit 3: what the X-T30 II actually does (the Link 3 has it)</text>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="30" y="282" width="110" height="40" rx="8" fill="#eef6f0" stroke="#1f8a4c" stroke-width="2"/><text x="85" y="307" fill="#1f8a4c">A: YUV</text>
    <rect x="245" y="282" width="110" height="40" rx="8" fill="#fff4e0" stroke="#c27a00" stroke-width="2"/><text x="300" y="307" fill="#c27a00">A: ARGB</text>
    <rect x="460" y="282" width="110" height="40" rx="8" fill="#eef6f0" stroke="#1f8a4c" stroke-width="2"/><text x="515" y="307" fill="#1f8a4c">B: YUV</text>
    <rect x="460" y="370" width="110" height="48" rx="8" fill="#fdecea" stroke="#d9372b" stroke-width="2.5"/><text x="515" y="390" fill="#d9372b">B: half of</text><text x="515" y="406" fill="#d9372b">the ARGB</text>
    <rect x="640" y="374" width="130" height="40" rx="8" fill="#f3c6ef" stroke="#22272a" stroke-width="2"/><text x="705" y="399" fill="#22272a">pink, zoomed x2</text>
  </g>
  <path d="M142 302 H239" stroke="#22272a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M357 302 H454" stroke="#22272a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M515 324 V364" stroke="#d9372b" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M300 324 C 300 394, 380 394, 454 394" fill="none" stroke="#d9372b" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="40" y="360" font-size="12" fill="#d9372b" font-weight="700">then "copy A to B" runs anyway</text>
  <text x="40" y="376" font-size="11" fill="#d9372b">and overwrites the good B</text>
  <path d="M572 394 H634" stroke="#22272a" stroke-width="2" marker-end="url(#a)"/>

  <!-- fix -->
  <rect x="30" y="450" width="740" height="92" rx="12" fill="#eef6f0" stroke="#1f8a4c" stroke-width="2"/>
  <text x="50" y="476" font-size="14" font-weight="700" fill="#1f8a4c">The fix: hide bit 3 from the app</text>
  <text x="50" y="502" font-size="13" fill="#22272a" font-family="Menlo,monospace">out[5] = rep[13] &amp; ~8;</text>
  <text x="50" y="528" font-size="13" fill="#22272a">The app then takes the first path: a plain copy A to B, and a clean JPEG.</text>
</svg>
