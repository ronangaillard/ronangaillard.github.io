<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial,Helvetica,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#000000"/></marker>
  </defs>
  <rect width="800" height="420" fill="#ffffff"/>
  <g font-size="14" fill="#000000">
    <rect x="63" y="23" width="400" height="58" fill="#000000"/><rect x="60" y="20" width="400" height="58" fill="#ffffff" stroke="#008080" stroke-width="2"/>
    <text x="80" y="44" font-weight="700">Fuji's print app</text>
    <text x="80" y="64" font-size="12" fill="#404040">unchanged: menus, crop, rotate, JPEG, progress bar</text>

    <path d="M260 80 V112" stroke="#000000" stroke-width="2" marker-end="url(#a)"/>
    <text x="272" y="101" font-size="12" fill="#404040">calls the old stubs: "get info", "send", "print"…</text>

    <rect x="63" y="121" width="400" height="66" fill="#000000"/><rect x="60" y="118" width="400" height="66" fill="#ffff00" stroke="#808000" stroke-width="2"/>
    <text x="80" y="143" font-weight="700">linkxt  <tspan font-weight="400" font-size="12" fill="#404040">my C module, ~3 KB</tspan></text>
    <text x="80" y="164" font-size="12" fill="#404040">lives in a 4 KB hole of zeros at <tspan font-family="'Courier New',Courier,monospace">0x01e12030</tspan></text>

    <path d="M260 186 V218" stroke="#000000" stroke-width="2" marker-end="url(#a)"/>
    <text x="272" y="207" font-size="12" fill="#404040">scan · connect · write · wait for notify</text>

    <rect x="63" y="227" width="400" height="58" fill="#000000"/><rect x="60" y="224" width="400" height="58" fill="#c0c0c0" stroke="#000080" stroke-width="2"/><path d="M62.5 279V226.5H457" fill="none" stroke="#ffffff" stroke-width="2"/><path d="M63 279.5H457.5V227" fill="none" stroke="#808080" stroke-width="2"/>
    <text x="80" y="248" font-weight="700">Fuji's own BLE stack</text>
    <text x="80" y="268" font-size="12" fill="#404040">the one the Bluetooth grip already uses</text>
  </g>
  <!-- waves -->
  <g fill="none" stroke="#000080" stroke-width="2" stroke-linecap="round">
    <path d="M478 238 a22 22 0 0 1 0 30"/><path d="M492 228 a36 36 0 0 1 0 50"/><path d="M506 218 a50 50 0 0 1 0 70"/>
  </g>
  <g transform="translate(560,190)" stroke="#000000" stroke-width="2">
    <rect width="70" height="106" fill="#ffc0ff"/>
    <rect x="12" y="-6" width="46" height="10" rx="2" fill="#fff"/>
    <circle cx="35" cy="74" r="9" fill="#fff"/>
  </g>
  <text x="650" y="238" font-size="14" font-weight="700" fill="#000000">Link 3</text>

  <!-- side note -->
  <rect x="523" y="23" width="250" height="140" fill="#000000"/><rect x="520" y="20" width="250" height="140" fill="#fff" stroke="#808080" stroke-width="1"/>
  <text x="536" y="44" font-size="13" font-weight="700" fill="#000000">+ a few one-word patches</text>
  <text x="536" y="68" font-size="12" fill="#000000">• stubs jump into linkxt</text>
  <text x="536" y="89" font-size="12" fill="#000000">• menu: Bluetooth is "supported"</text>
  <text x="536" y="110" font-size="12" fill="#000000">• accept serials starting with 7</text>
  <text x="550" y="128" font-size="12" fill="#404040">(the Link 3; the firmware only</text>
  <text x="550" y="145" font-size="12" fill="#404040">knew 1 and 2)</text>

  <!-- packet -->
  <text x="40" y="330" font-size="14" font-weight="700" fill="#000000">One instax packet</text>
  <g font-family="'Courier New',Courier,monospace" font-size="13" text-anchor="middle">
    <rect x="43" y="345" width="110" height="40" fill="#000000"/><rect x="40" y="342" width="110" height="40" fill="#ffc0ff" stroke="#000000" stroke-width="2"/><text x="95" y="367" fill="#000000">41 62</text>
    <rect x="153" y="345" width="120" height="40" fill="#000000"/><rect x="150" y="342" width="120" height="40" fill="#fff" stroke="#000000" stroke-width="2"/><text x="210" y="367" fill="#000000">length</text>
    <rect x="273" y="345" width="120" height="40" fill="#000000"/><rect x="270" y="342" width="120" height="40" fill="#ffff00" stroke="#000000" stroke-width="2"/><text x="330" y="367" fill="#000000">opcode</text>
    <rect x="393" y="345" width="280" height="40" fill="#000000"/><rect x="390" y="342" width="280" height="40" fill="#fff" stroke="#000000" stroke-width="2"/><text x="530" y="367" fill="#000000">payload…</text>
    <rect x="673" y="345" width="90" height="40" fill="#000000"/><rect x="670" y="342" width="90" height="40" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="715" y="367" fill="#000000">sum</text>
  </g>
  <g font-size="11" fill="#404040" text-anchor="middle">
    <text x="95" y="400">"Ab"</text><text x="210" y="400">2 bytes</text><text x="330" y="400">2 bytes</text><text x="530" y="400">up to 900 bytes of JPEG</text><text x="715" y="400">all bytes → 0xFF</text>
  </g>
</svg>
