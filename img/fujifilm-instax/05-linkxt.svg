<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#22272a"/></marker>
  </defs>
  <rect width="800" height="420" fill="#fafafa"/>
  <g font-size="14" fill="#22272a">
    <rect x="60" y="20" width="400" height="58" rx="10" fill="#eef6f0" stroke="#1f8a4c" stroke-width="2"/>
    <text x="80" y="44" font-weight="700">Fuji's print app</text>
    <text x="80" y="64" font-size="12" fill="#6b7280">unchanged: menus, crop, rotate, JPEG, progress bar</text>

    <path d="M260 80 V112" stroke="#22272a" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="272" y="101" font-size="12" fill="#6b7280">calls the old stubs: "get info", "send", "print"…</text>

    <rect x="60" y="118" width="400" height="66" rx="10" fill="#fff4e0" stroke="#c27a00" stroke-width="2.5"/>
    <text x="80" y="143" font-weight="700">linkxt  <tspan font-weight="400" font-size="12" fill="#6b7280">my C module, ~3 KB</tspan></text>
    <text x="80" y="164" font-size="12" fill="#6b7280">lives in a 4 KB hole of zeros at <tspan font-family="Menlo,monospace">0x01e12030</tspan></text>

    <path d="M260 186 V218" stroke="#22272a" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="272" y="207" font-size="12" fill="#6b7280">scan · connect · write · wait for notify</text>

    <rect x="60" y="224" width="400" height="58" rx="10" fill="#e8efff" stroke="#2563eb" stroke-width="2"/>
    <text x="80" y="248" font-weight="700">Fuji's own BLE stack</text>
    <text x="80" y="268" font-size="12" fill="#6b7280">the one the Bluetooth grip already uses</text>
  </g>
  <!-- waves -->
  <g fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round">
    <path d="M478 238 a22 22 0 0 1 0 30"/><path d="M492 228 a36 36 0 0 1 0 50"/><path d="M506 218 a50 50 0 0 1 0 70"/>
  </g>
  <g transform="translate(560,190)" stroke="#22272a" stroke-width="2.5">
    <rect width="70" height="106" rx="14" fill="#f7d7e6"/>
    <rect x="12" y="-6" width="46" height="10" rx="3" fill="#fff"/>
    <circle cx="35" cy="74" r="9" fill="#fff"/>
  </g>
  <text x="650" y="238" font-size="14" font-weight="700" fill="#22272a">Link 3</text>

  <!-- side note -->
  <rect x="520" y="20" width="250" height="140" rx="10" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="536" y="44" font-size="13" font-weight="700" fill="#22272a">+ a few one-word patches</text>
  <text x="536" y="68" font-size="12" fill="#22272a">• stubs jump into linkxt</text>
  <text x="536" y="89" font-size="12" fill="#22272a">• menu: Bluetooth is "supported"</text>
  <text x="536" y="110" font-size="12" fill="#22272a">• accept serials starting with 7</text>
  <text x="550" y="128" font-size="12" fill="#6b7280">(the Link 3; the firmware only</text>
  <text x="550" y="145" font-size="12" fill="#6b7280">knew 1 and 2)</text>

  <!-- packet -->
  <text x="40" y="330" font-size="14" font-weight="700" fill="#22272a">One instax packet</text>
  <g font-family="Menlo,monospace" font-size="13" text-anchor="middle">
    <rect x="40" y="342" width="110" height="40" fill="#f7d7e6" stroke="#22272a" stroke-width="2"/><text x="95" y="367" fill="#22272a">41 62</text>
    <rect x="150" y="342" width="120" height="40" fill="#fff" stroke="#22272a" stroke-width="2"/><text x="210" y="367" fill="#22272a">length</text>
    <rect x="270" y="342" width="120" height="40" fill="#fff4e0" stroke="#22272a" stroke-width="2"/><text x="330" y="367" fill="#22272a">opcode</text>
    <rect x="390" y="342" width="280" height="40" fill="#fff" stroke="#22272a" stroke-width="2"/><text x="530" y="367" fill="#22272a">payload…</text>
    <rect x="670" y="342" width="90" height="40" fill="#eef6f0" stroke="#22272a" stroke-width="2"/><text x="715" y="367" fill="#22272a">sum</text>
  </g>
  <g font-size="11" fill="#6b7280" text-anchor="middle">
    <text x="95" y="400">"Ab"</text><text x="210" y="400">2 bytes</text><text x="330" y="400">2 bytes</text><text x="530" y="400">up to 900 bytes of JPEG</text><text x="715" y="400">all bytes → 0xFF</text>
  </g>
</svg>
