<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <rect width="800" height="300" fill="#fafafa"/>
  <text x="400" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#22272a">Trial 10, read with a stopwatch</text>
  <!-- time axis: 0..120 s mapped to x 60..760 -->
  <path d="M60 170 H760" stroke="#22272a" stroke-width="2"/>
  <g font-size="11" fill="#6b7280" text-anchor="middle">
    <text x="60" y="190">0 s</text><text x="200" y="190">20 s</text><text x="352" y="190">46 s</text><text x="701" y="190">110 s</text>
  </g>
  <!-- LED strip -->
  <rect x="60" y="120" width="57" height="36" fill="#e5e7eb"/>
  <rect x="101" y="120" width="8" height="36" fill="#1f8a4c"/>
  <rect x="118" y="120" width="8" height="36" fill="#1f8a4c"/>
  <rect x="147" y="120" width="8" height="36" fill="#1f8a4c"/>
  <rect x="200" y="120" width="502" height="36" fill="#d9372b"/>
  <rect x="702" y="120" width="58" height="36" fill="#1f8a4c"/>
  <rect x="60" y="120" width="700" height="36" fill="none" stroke="#22272a" stroke-width="2"/>
  <text x="40" y="143" text-anchor="end" font-size="12" font-weight="700" fill="#22272a">LED</text>
  <!-- annotations -->
  <g font-size="12" fill="#22272a">
    <path d="M105 116 V84 M122 116 V84 M151 116 V84" stroke="#1f8a4c" stroke-width="1.5"/>
    <text x="128" y="62" text-anchor="middle" font-weight="700" fill="#1f8a4c">1 · 2 · 3 blinks</text>
    <text x="128" y="78" text-anchor="middle" font-size="11" fill="#6b7280">SD ok · sector 0 read · ready</text>
    <text x="451" y="94" text-anchor="middle" font-weight="700" fill="#d9372b">solid red for 90 s</text>
    <text x="451" y="110" text-anchor="middle" font-size="11" fill="#6b7280">"stuck"? no: reading 72 MB at 0.8 MB/s</text>
    <text x="731" y="94" text-anchor="middle" font-weight="700" fill="#1f8a4c">green</text>
    <text x="731" y="110" text-anchor="middle" font-size="11" fill="#6b7280">jump to RAM</text>
  </g>
  <rect x="110" y="222" width="580" height="50" rx="25" fill="#fff4e0" stroke="#c27a00" stroke-width="2"/>
  <text x="400" y="244" text-anchor="middle" font-size="13" fill="#22272a">The loader worked all along. I just hadn't waited long enough.</text>
  <text x="400" y="262" text-anchor="middle" font-size="12" fill="#6b7280">Then the screen stayed black: the real problem was after the jump.</text>
</svg>
