<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Arial,Helvetica,sans-serif">
  <rect width="800" height="300" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#000000">Trial 10, read with a stopwatch</text>
  <!-- time axis: 0..120 s mapped to x 60..760 -->
  <path d="M60 170 H760" stroke="#000000" stroke-width="2"/>
  <g font-size="11" fill="#404040" text-anchor="middle">
    <text x="60" y="190">0 s</text><text x="200" y="190">20 s</text><text x="352" y="190">46 s</text><text x="701" y="190">110 s</text>
  </g>
  <!-- LED strip -->
  <rect x="60" y="120" width="57" height="36" fill="#c0c0c0"/>
  <rect x="101" y="120" width="8" height="36" fill="#008080"/>
  <rect x="118" y="120" width="8" height="36" fill="#008080"/>
  <rect x="147" y="120" width="8" height="36" fill="#008080"/>
  <rect x="200" y="120" width="502" height="36" fill="#ff0000"/>
  <rect x="702" y="120" width="58" height="36" fill="#008080"/>
  <rect x="60" y="120" width="700" height="36" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="40" y="143" text-anchor="end" font-size="12" font-weight="700" fill="#000000">LED</text>
  <!-- annotations -->
  <g font-size="12" fill="#000000">
    <path d="M105 116 V84 M122 116 V84 M151 116 V84" stroke="#008080" stroke-width="1"/>
    <text x="128" y="62" text-anchor="middle" font-weight="700" fill="#008080">1 · 2 · 3 blinks</text>
    <text x="128" y="78" text-anchor="middle" font-size="11" fill="#404040">SD ok · sector 0 read · ready</text>
    <text x="451" y="94" text-anchor="middle" font-weight="700" fill="#ff0000">solid red for 90 s</text>
    <text x="451" y="110" text-anchor="middle" font-size="11" fill="#404040">"stuck"? no: reading 72 MB at 0.8 MB/s</text>
    <text x="731" y="94" text-anchor="middle" font-weight="700" fill="#008080">green</text>
    <text x="731" y="110" text-anchor="middle" font-size="11" fill="#404040">jump to RAM</text>
  </g>
  <rect x="113" y="225" width="580" height="50" fill="#000000"/><rect x="110" y="222" width="580" height="50" fill="#ffff00" stroke="#808000" stroke-width="2"/>
  <text x="400" y="244" text-anchor="middle" font-size="13" fill="#000000">The loader worked all along. I just hadn't waited long enough.</text>
  <text x="400" y="262" text-anchor="middle" font-size="12" fill="#404040">Then the screen stayed black: the real problem was after the jump.</text>
</svg>
