<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial,Helvetica,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#000000"/></marker>
  </defs>
  <rect width="800" height="400" fill="#ffffff"/>
  <!-- loop arcs -->
  <g fill="none" stroke="#000000" stroke-width="2" marker-end="url(#a)">
    <path d="M330 72 C 400 56, 440 56, 500 72"/>
    <path d="M590 130 C 620 170, 620 210, 590 252"/>
    <path d="M500 312 C 440 330, 400 330, 330 312"/>
    <path d="M220 252 C 190 210, 190 170, 220 130"/>
  </g>
  <g font-size="13" fill="#000000">
    <rect x="113" y="43" width="220" height="86" fill="#000000"/><rect x="110" y="40" width="220" height="86" fill="#ffff00" stroke="#808000" stroke-width="2"/>
    <text x="126" y="64" font-weight="700">1. Build a card on the Mac</text>
    <text x="126" y="84" font-size="12" fill="#404040">compile linkxt, patch the</text>
    <text x="126" y="100" font-size="12" fill="#404040">RAM image, test it in an</text>
    <text x="126" y="116" font-size="12" fill="#404040">emulator with a fake Link 3</text>

    <rect x="503" y="43" width="220" height="86" fill="#000000"/><rect x="500" y="40" width="220" height="86" fill="#c0c0c0" stroke="#000080" stroke-width="2"/><path d="M502.5 123V42.5H717" fill="none" stroke="#ffffff" stroke-width="2"/><path d="M503 123.5H717.5V43" fill="none" stroke="#808080" stroke-width="2"/>
    <text x="516" y="64" font-weight="700">2. Copy it to the SD card</text>
    <text x="516" y="84" font-size="12" fill="#404040">check the checksums,</text>
    <text x="516" y="100" font-size="12" fill="#404040">eject, put it in the camera</text>

    <rect x="503" y="259" width="220" height="86" fill="#000000"/><rect x="500" y="256" width="220" height="86" fill="#ffffff" stroke="#008080" stroke-width="2"/>
    <text x="516" y="280" font-weight="700">3. Boot and try to print</text>
    <text x="516" y="300" font-size="12" fill="#404040">linkxt writes a text log</text>
    <text x="516" y="316" font-size="12" fill="#404040">(and dumps buffers) to the</text>
    <text x="516" y="332" font-size="12" fill="#404040">SD card as it goes</text>

    <rect x="113" y="259" width="220" height="86" fill="#000000"/><rect x="110" y="256" width="220" height="86" fill="#ffc0ff" stroke="#800080" stroke-width="2"/>
    <text x="126" y="280" font-weight="700">4. Pull the battery</text>
    <text x="126" y="300" font-size="12" fill="#404040">card back in the Mac,</text>
    <text x="126" y="316" font-size="12" fill="#404040">read <tspan font-family="'Courier New',Courier,monospace">LINKXT.TXT</tspan>, decide</text>
    <text x="126" y="332" font-size="12" fill="#404040">what the next card tests</text>
  </g>
  <circle cx="415" cy="190" r="62" fill="#000000"/>
  <text x="415" y="182" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">46</text>
  <text x="415" y="202" text-anchor="middle" font-size="12" fill="#808080">trials</text>
  <text x="415" y="218" text-anchor="middle" font-size="11" fill="#808080">~10 min each</text>
  <text x="400" y="382" text-anchor="middle" font-size="13" fill="#404040" font-style="italic">Most cards were "no-print" builds: they do everything except the last command, so no film is wasted.</text>
</svg>
