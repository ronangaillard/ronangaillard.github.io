<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#22272a"/></marker>
  </defs>
  <rect width="800" height="320" fill="#fafafa"/>
  <!-- file -->
  <g transform="translate(20,70)" stroke="#22272a" stroke-width="2.5">
    <path d="M0 0 H82 L112 30 V170 H0 Z" fill="#fff"/>
    <path d="M82 0 V30 H112" fill="#e9e9e9"/>
  </g>
  <text x="76" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#22272a" font-family="Menlo,monospace">FWUP0029</text>
  <text x="76" y="167" text-anchor="middle" font-size="13" font-weight="700" fill="#22272a" font-family="Menlo,monospace">.DAT</text>
  <text x="76" y="200" text-anchor="middle" font-size="11" fill="#6b7280">official update,</text>
  <text x="76" y="214" text-anchor="middle" font-size="11" fill="#6b7280">fujifilm.com</text>
  <path d="M140 155 H170" stroke="#22272a" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- steps -->
  <g font-size="13" fill="#22272a">
    <rect x="178" y="70" width="210" height="48" rx="10" fill="#fff4e0" stroke="#c27a00" stroke-width="2"/>
    <text x="194" y="91" font-weight="700">1. cut the header</text>
    <text x="194" y="108" fill="#6b7280" font-size="12">model ID, version, checksums</text>
    <rect x="178" y="131" width="210" height="48" rx="10" fill="#fff4e0" stroke="#c27a00" stroke-width="2"/>
    <text x="194" y="152" font-weight="700">2. flip every bit</text>
    <text x="194" y="169" fill="#6b7280" font-size="12" font-family="Menlo,monospace">byte = ~byte</text>
    <rect x="178" y="192" width="210" height="48" rx="10" fill="#fff4e0" stroke="#c27a00" stroke-width="2"/>
    <text x="194" y="213" font-weight="700">3. decompress 4 blocks</text>
    <text x="194" y="230" fill="#6b7280" font-size="12">home-made LZ variant</text>
  </g>
  <path d="M396 155 H426" stroke="#22272a" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- blocks -->
  <g font-size="13" fill="#22272a">
    <rect x="434" y="58" width="190" height="44" rx="6" fill="#e8efff" stroke="#2563eb" stroke-width="2"/>
    <text x="446" y="77" font-weight="700">block 1 · ARM code</text>
    <text x="446" y="94" font-size="11" fill="#6b7280" font-family="Menlo,monospace">@ 0x01021000</text>
    <rect x="434" y="108" width="190" height="44" rx="6" fill="#e8efff" stroke="#2563eb" stroke-width="2"/>
    <text x="446" y="127" font-weight="700">block 2 · ARM code</text>
    <text x="446" y="144" font-size="11" fill="#6b7280"><tspan font-family="Menlo,monospace">@ 0x01e12000</tspan> · instax stubs</text>
    <rect x="434" y="158" width="190" height="44" rx="6" fill="#e8efff" stroke="#2563eb" stroke-width="2"/>
    <text x="446" y="177" font-weight="700">block 3 · ARM code</text>
    <text x="446" y="194" font-size="11" fill="#6b7280"><tspan font-family="Menlo,monospace">@ 0x03b21000</tspan> · print app</text>
    <rect x="434" y="208" width="190" height="44" rx="6" fill="#f2f2f2" stroke="#9ca3af" stroke-width="2"/>
    <text x="446" y="235" font-weight="700">block 4 · data</text>
  </g>
  <path d="M632 155 H662" stroke="#22272a" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- ghidra -->
  <rect x="670" y="105" width="115" height="100" rx="12" fill="#22272a"/>
  <text x="727" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Ghidra</text>
  <text x="727" y="158" text-anchor="middle" font-size="12" fill="#d1d5db">~59 000</text>
  <text x="727" y="174" text-anchor="middle" font-size="12" fill="#d1d5db">functions</text>
  <text x="727" y="192" text-anchor="middle" font-size="11" fill="#9ca3af">Cortex-A7 · ThreadX</text>

  <text x="400" y="296" text-anchor="middle" font-size="13" fill="#6b7280" font-style="italic">Load addresses found by matching string pointers with string offsets, then confirmed in the code.</text>
</svg>
