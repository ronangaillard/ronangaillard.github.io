<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#22272a"/></marker>
  </defs>
  <rect width="800" height="520" fill="#fafafa"/>

  <!-- the file -->
  <text x="30" y="30" font-size="14" font-weight="700" fill="#22272a">FWUP0029.DAT, the official update (50 MB)</text>
  <rect x="30" y="42" width="110" height="34" fill="#fff4e0" stroke="#c27a00" stroke-width="2"/>
  <text x="85" y="64" text-anchor="middle" font-size="12" fill="#22272a">header</text>
  <rect x="140" y="42" width="630" height="34" fill="#e5e7eb" stroke="#22272a" stroke-width="2"/>
  <text x="455" y="64" text-anchor="middle" font-size="12" fill="#6b7280">payload: looks like random noise</text>

  <!-- step 1 -->
  <circle cx="44" cy="118" r="13" fill="#22272a"/><text x="44" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
  <text x="66" y="114" font-size="14" font-weight="700" fill="#22272a">Cut the header</text>
  <text x="66" y="132" font-size="12" fill="#6b7280">The first bytes describe the file: camera model, version, checksums. Keep what follows.</text>

  <!-- step 2 -->
  <circle cx="44" cy="178" r="13" fill="#22272a"/><text x="44" y="183" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
  <text x="66" y="174" font-size="14" font-weight="700" fill="#22272a">Flip every bit (the whole "encryption")</text>
  <g font-family="Menlo,monospace" font-size="14">
    <rect x="66" y="188" width="250" height="34" rx="6" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="191" y="210" text-anchor="middle" fill="#6b7280">b9 aa b5 b6 b9 b6 b3 b2</text>
    <path d="M324 205 H364" stroke="#22272a" stroke-width="2" marker-end="url(#a)"/>
    <text x="344" y="198" text-anchor="middle" font-size="11" fill="#6b7280" font-family="-apple-system,Helvetica,Arial,sans-serif">NOT</text>
    <rect x="372" y="188" width="250" height="34" rx="6" fill="#fff" stroke="#1f8a4c" stroke-width="1.5"/>
    <text x="497" y="210" text-anchor="middle" fill="#22272a">46 55 4a 49 46 49 4c 4d</text>
  </g>
  <text x="634" y="210" font-size="13" fill="#1f8a4c" font-family="Menlo,monospace">= "FUJIFILM"</text>

  <!-- step 3 -->
  <circle cx="44" cy="262" r="13" fill="#22272a"/><text x="44" y="267" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
  <text x="66" y="258" font-size="14" font-weight="700" fill="#22272a">Decompress 4 blocks (Fuji's own LZ)</text>
  <g font-size="13">
    <rect x="66" y="272" width="96" height="34" rx="6" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="114" y="294" text-anchor="middle" fill="#22272a" font-family="Menlo,monospace">"abc"</text>
    <rect x="166" y="272" width="250" height="34" rx="6" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="291" y="294" text-anchor="middle" fill="#22272a">copy 6 bytes from 3 bytes back</text>
    <path d="M424 289 H474" stroke="#22272a" stroke-width="2" marker-end="url(#a)"/>
    <rect x="482" y="272" width="160" height="34" rx="6" fill="#fff" stroke="#1f8a4c" stroke-width="1.5"/>
    <text x="562" y="294" text-anchor="middle" fill="#22272a" font-family="Menlo,monospace">"abcabcabc"</text>
  </g>
  <text x="66" y="324" font-size="11" fill="#6b7280">literal bytes, then a 2-byte "copy" instruction: repeats are stored once</text>

  <!-- check -->
  <rect x="30" y="346" width="740" height="56" rx="10" fill="#eef6f0" stroke="#1f8a4c" stroke-width="2"/>
  <text x="50" y="370" font-size="13" fill="#22272a"><tspan font-weight="700">How do I know it's right?</tspan> The firmware embeds zlib, a public library, and its tables.</text>
  <text x="50" y="390" font-size="13" fill="#22272a">After my decompressor, they match the published zlib tables byte for byte.</text>

  <!-- output -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="30" y="428" width="160" height="40" rx="6" fill="#e8efff" stroke="#2563eb" stroke-width="2"/><text x="110" y="452" fill="#22272a">block 1: ARM code</text>
    <rect x="200" y="428" width="160" height="40" rx="6" fill="#e8efff" stroke="#2563eb" stroke-width="2"/><text x="280" y="452" fill="#22272a">block 2: ARM code</text>
    <rect x="370" y="428" width="160" height="40" rx="6" fill="#e8efff" stroke="#2563eb" stroke-width="2"/><text x="450" y="452" fill="#22272a">block 3: ARM code</text>
    <rect x="30" y="474" width="500" height="32" rx="6" fill="#f2f2f2" stroke="#9ca3af" stroke-width="2"/><text x="280" y="495" fill="#6b7280">block 4: data</text>
  </g>
  <path d="M540 448 H600" stroke="#22272a" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="608" y="420" width="162" height="86" rx="12" fill="#22272a"/>
  <text x="689" y="450" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Ghidra</text>
  <text x="689" y="472" text-anchor="middle" font-size="12" fill="#d1d5db">~59,000 functions</text>
  <text x="689" y="490" text-anchor="middle" font-size="11" fill="#9ca3af">Cortex-A7, ThreadX</text>
</svg>
