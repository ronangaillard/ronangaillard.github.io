<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Arial,Helvetica,sans-serif">
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#000000"/></marker>
    <marker id="l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#800080"/></marker>
  </defs>
  <rect width="800" height="560" fill="#ffffff"/>
  <rect x="83" y="17" width="160" height="38" fill="#000000"/><rect x="80" y="14" width="160" height="38" fill="#c0c0c0" stroke="#000000" stroke-width="2"/><path d="M82.5 49V16.5H237" fill="none" stroke="#ffffff" stroke-width="2"/><path d="M83 49.5H237.5V17" fill="none" stroke="#808080" stroke-width="2"/>
  <text x="160" y="39" text-anchor="middle" font-size="15" font-weight="700" fill="#000000">X-T30 II</text>
  <rect x="563" y="17" width="160" height="38" fill="#000000"/><rect x="560" y="14" width="160" height="38" fill="#ffc0ff" stroke="#000000" stroke-width="2"/>
  <text x="640" y="39" text-anchor="middle" font-size="15" font-weight="700" fill="#000000">Link 3</text>
  <path d="M160 52 V545 M640 52 V545" stroke="#808080" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- phase labels -->
  <g font-size="11" font-weight="700" fill="#404040" letter-spacing="1">
    <text x="20" y="84">CONNECT</text>
    <text x="20" y="150">WHO ARE</text><text x="20" y="164">YOU?</text>
    <text x="20" y="340">UPLOAD</text>
    <text x="20" y="470">PRINT</text>
  </g>
  <rect x="170" y="66" width="460" height="30" fill="#c0c0c0"/>
  <text x="400" y="86" text-anchor="middle" font-size="12" fill="#000000">scan · connect · MTU 247 · find service <tspan font-family="'Courier New',Courier,monospace">70954782-…</tspan> · enable notify</text>

  <g font-size="12" fill="#000000">
    <!-- rows: request at y, reply at y+16 -->
    <g id="rows">
      <path d="M162 118 H636" stroke="#000000" stroke-width="1" marker-end="url(#r)"/><text x="176" y="113"><tspan font-family="'Courier New',Courier,monospace">0x0000</tspan> device info</text>
      <path d="M638 134 H164" stroke="#800080" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#l)"/><text x="624" y="148" text-anchor="end" fill="#800080">a layout the camera rejects → patched</text>

      <path d="M162 170 H636" stroke="#000000" stroke-width="1" marker-end="url(#r)"/><text x="176" y="165"><tspan font-family="'Courier New',Courier,monospace">0x0001</tspan> maker? serial?</text>
      <path d="M638 186 H164" stroke="#800080" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#l)"/><text x="624" y="200" text-anchor="end" fill="#800080">"FUJIFILM", "7xxxxxxx"</text>

      <path d="M162 222 H636" stroke="#000000" stroke-width="1" marker-end="url(#r)"/><text x="176" y="217"><tspan font-family="'Courier New',Courier,monospace">0x0002</tspan> battery? image specs?</text>
      <path d="M638 238 H164" stroke="#800080" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#l)"/><text x="624" y="252" text-anchor="end" fill="#800080">600 × 800, max 150 KB, capability flags</text>

      <path d="M162 290 H636" stroke="#000000" stroke-width="1" marker-end="url(#r)"/><text x="176" y="285"><tspan font-family="'Courier New',Courier,monospace">0x1000</tspan> START, size = 120 894</text>
      <path d="M638 306 H164" stroke="#800080" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#l)"/><text x="624" y="320" text-anchor="end" fill="#800080">ok, send me 900-byte chunks</text>
    </g>
    <rect x="168" y="332" width="464" height="66" fill="none" stroke="#808000" stroke-width="1"/>
    <text x="178" y="348" font-size="11" font-weight="700" fill="#808000">LOOP × 135</text>
    <path d="M162 366 H636" stroke="#000000" stroke-width="1" marker-end="url(#r)"/><text x="260" y="361"><tspan font-family="'Courier New',Courier,monospace">0x1001</tspan> DATA #n + 900 bytes</text>
    <path d="M638 382 H164" stroke="#800080" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#l)"/><text x="624" y="394" text-anchor="end" fill="#800080">ack #n</text>

    <path d="M162 422 H636" stroke="#000000" stroke-width="1" marker-end="url(#r)"/><text x="176" y="417"><tspan font-family="'Courier New',Courier,monospace">0x1002</tspan> END</text>
    <path d="M162 462 H636" stroke="#000000" stroke-width="1" marker-end="url(#r)"/><text x="176" y="457"><tspan font-family="'Courier New',Courier,monospace">0x1080</tspan> PRINT</text>
    <path d="M638 478 H164" stroke="#800080" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#l)"/><text x="624" y="492" text-anchor="end" fill="#800080">status 0x10 (= "printing")</text>
    <path d="M162 512 H636" stroke="#000000" stroke-width="1" marker-end="url(#r)"/><text x="176" y="507"><tspan font-family="'Courier New',Courier,monospace">0x0002</tspan> are you done? (polled)</text>
    <path d="M638 528 H164" stroke="#800080" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#l)"/><text x="624" y="542" text-anchor="end" fill="#800080">busy… busy… done, films left: 7 → 6</text>
  </g>
</svg>
