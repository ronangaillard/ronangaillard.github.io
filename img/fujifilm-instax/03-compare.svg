<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Arial,Helvetica,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#808000"/></marker>
  </defs>
  <rect width="800" height="380" fill="#ffffff"/>
  <text x="160" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#000000">X-S10 (fw 3.11)</text>
  <text x="160" y="55" text-anchor="middle" font-size="12" fill="#404040">same processor, prints to Link</text>
  <text x="640" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#000000">X-T30 II (fw 2.04)</text>
  <text x="640" y="55" text-anchor="middle" font-size="12" fill="#404040">my camera</text>

  <g font-size="14" fill="#000000">
    <!-- X-S10 column -->
    <rect x="43" y="75" width="240" height="56" fill="#000000"/><rect x="40" y="72" width="240" height="56" fill="#ffffff" stroke="#008080" stroke-width="2"/>
    <text x="56" y="97" font-weight="700">Menu: "connect via BT"</text><text x="262" y="106" text-anchor="end" fill="#008080" font-size="22">✓</text>
    <rect x="43" y="141" width="240" height="56" fill="#000000"/><rect x="40" y="138" width="240" height="56" fill="#ffffff" stroke="#008080" stroke-width="2"/>
    <text x="56" y="162" font-weight="700">Print app</text><text x="56" y="180" font-size="12" fill="#404040">crop · rotate · JPEG · send</text><text x="262" y="172" text-anchor="end" fill="#008080" font-size="22">✓</text>
    <rect x="43" y="207" width="240" height="56" fill="#000000"/><rect x="40" y="204" width="240" height="56" fill="#ffffff" stroke="#008080" stroke-width="2"/>
    <text x="56" y="228" font-weight="700">instax BLE transport</text><text x="56" y="246" font-size="12" fill="#404040">task "instaxbt", ~13.5 KB</text><text x="262" y="238" text-anchor="end" fill="#008080" font-size="22">✓</text>
    <rect x="43" y="273" width="240" height="56" fill="#000000"/><rect x="40" y="270" width="240" height="56" fill="#ffffff" stroke="#008080" stroke-width="2"/>
    <text x="56" y="303" font-weight="700">Bluetooth LE stack</text><text x="262" y="304" text-anchor="end" fill="#008080" font-size="22">✓</text>

    <!-- X-T30 II column -->
    <rect x="520" y="72" width="240" height="56" fill="#c0c0c0" stroke="#808080" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="536" y="97" font-weight="700" fill="#404040">Menu: missing</text><text x="536" y="115" font-size="12" fill="#404040">Wi-Fi only</text><text x="742" y="106" text-anchor="end" fill="#ff0000" font-size="22">✗</text>
    <rect x="523" y="141" width="240" height="56" fill="#000000"/><rect x="520" y="138" width="240" height="56" fill="#ffffff" stroke="#008080" stroke-width="2"/>
    <text x="536" y="162" font-weight="700">Print app</text><text x="536" y="180" font-size="12" fill="#404040">same code, still there!</text><text x="742" y="172" text-anchor="end" fill="#008080" font-size="22">✓</text>
    <rect x="520" y="204" width="240" height="56" fill="#ffc0c0" stroke="#ff0000" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="536" y="228" font-weight="700">instax BLE transport</text><text x="536" y="246" font-size="12" fill="#ff0000" font-family="'Courier New',Courier,monospace">return 0;  // stubs</text><text x="742" y="238" text-anchor="end" fill="#ff0000" font-size="22">✗</text>
    <rect x="523" y="273" width="240" height="56" fill="#000000"/><rect x="520" y="270" width="240" height="56" fill="#ffffff" stroke="#008080" stroke-width="2"/>
    <text x="536" y="294" font-weight="700">Bluetooth LE stack</text><text x="536" y="312" font-size="12" fill="#404040">used by the Bluetooth grip</text><text x="742" y="304" text-anchor="end" fill="#008080" font-size="22">✓</text>
  </g>

  <!-- links -->
  <path d="M288 166 H512" stroke="#008080" stroke-width="2" stroke-dasharray="3 5"/>
  <text x="400" y="158" text-anchor="middle" font-size="12" fill="#008080">109 functions ≥ 90 % identical</text>
  <path d="M288 232 H512" stroke="#808000" stroke-width="2" marker-end="url(#a)"/>
  <text x="400" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#808000">the missing piece</text>
  <text x="400" y="250" text-anchor="middle" font-size="12" fill="#808000">rewrite it → "linkxt"</text>

  <text x="400" y="362" text-anchor="middle" font-size="13" fill="#404040" font-style="italic">The X-T30 III also prints to Link, but it is 64-bit: useful only as a second reference.</text>
</svg>
