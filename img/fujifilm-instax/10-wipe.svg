<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#22272a"/></marker>
  </defs>
  <rect width="800" height="360" fill="#fafafa"/>
  <text x="400" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#22272a">One 128 KB area of RAM, during the first second of boot</text>

  <!-- step titles -->
  <g font-size="14" font-weight="700" fill="#22272a" text-anchor="middle">
    <text x="140" y="66">1. Card copied to RAM</text>
    <text x="400" y="66">2. Kernel cleans its logs</text>
    <text x="660" y="66">3. App starts</text>
  </g>

  <!-- 1 -->
  <rect x="60" y="80" width="160" height="140" rx="8" fill="#fff" stroke="#22272a" stroke-width="2"/>
  <rect x="72" y="92" width="136" height="54" rx="6" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#22272a">jitl's code</text>
  <text x="140" y="132" text-anchor="middle" font-size="11" fill="#6b7280">needed by the app</text>
  <rect x="72" y="154" width="136" height="54" rx="6" fill="#fff4e0" stroke="#c27a00" stroke-width="1.5"/>
  <text x="140" y="177" text-anchor="middle" font-size="12" font-weight="700" fill="#22272a">my debug code</text>
  <text x="140" y="194" text-anchor="middle" font-size="11" fill="#6b7280">writes the log</text>

  <path d="M230 150 H290" stroke="#22272a" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- 2 -->
  <rect x="320" y="80" width="160" height="140" rx="8" fill="#fff" stroke="#22272a" stroke-width="2"/>
  <text x="400" y="130" text-anchor="middle" font-size="20" fill="#9ca3af" font-family="Menlo,monospace">00 00 00 00</text>
  <text x="400" y="156" text-anchor="middle" font-size="20" fill="#9ca3af" font-family="Menlo,monospace">00 00 00 00</text>
  <text x="400" y="182" text-anchor="middle" font-size="20" fill="#9ca3af" font-family="Menlo,monospace">00 00 00 00</text>

  <path d="M490 150 H550" stroke="#22272a" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- 3 -->
  <rect x="580" y="80" width="160" height="140" rx="8" fill="#22272a"/>
  <text x="660" y="128" text-anchor="middle" font-size="12" fill="#fff">calls jitl's code…</text>
  <text x="660" y="148" text-anchor="middle" font-size="12" fill="#fff">finds zeros</text>
  <text x="660" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#d9372b">frozen</text>

  <!-- captions -->
  <g font-size="12" fill="#6b7280" text-anchor="middle">
    <text x="140" y="244">full of zeros in the image,</text>
    <text x="140" y="260">so it looked free</text>
    <text x="400" y="244">it's the kernel's log area:</text>
    <text x="400" y="260">it erases it at every boot</text>
    <text x="660" y="244">black screen,</text>
    <text x="660" y="260">no error, no log</text>
  </g>

  <rect x="90" y="290" width="620" height="48" rx="24" fill="#fff4e0" stroke="#c27a00" stroke-width="2"/>
  <text x="400" y="319" text-anchor="middle" font-size="13" fill="#22272a">My debug code was erased too: the tool meant to find the bug was erased by the bug.</text>
</svg>
